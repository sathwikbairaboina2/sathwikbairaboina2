<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Sathwik Bairaboina — engineer of the boundary between models and systems of record">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="45%" stop-color="#FF3D8B"/>
      <stop offset="100%" stop-color="#6D4AFF"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C2A8"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#FFFBF5"/>

    <!-- colour field -->
    <circle cx="1055" cy="70"  r="200" fill="url(#band)"  opacity="0.92"/>
    <circle cx="1160" cy="255" r="120" fill="url(#band2)" opacity="0.95"/>
    <circle cx="905"  cy="235" r="62"  fill="#10100E"/>
    <circle cx="905"  cy="235" r="26"  fill="#FFFBF5"/>

    <!-- rule marks -->
    <g fill="#10100E" opacity="0.16">
      <rect x="72" y="252" width="300" height="3"/>
      <rect x="72" y="262" width="180" height="3"/>
      <rect x="72" y="272" width="96"  height="3"/>
    </g>

    <text x="70" y="118" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="62" font-weight="700" fill="#10100E" letter-spacing="-1">SATHWIK</text>
    <text x="70" y="186" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="62" font-weight="700" fill="#FF5A36" letter-spacing="-1">BAIRABOINA</text>

    <text x="72" y="226" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="15" font-weight="700" fill="#5B5B52" letter-spacing="3">FULL STACK ENGINEER &#183; AI WORKFLOW ARCHITECT</text>
  </g>
</svg>
