<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="25 repositories, 2344 commits, 181 thousand lines of code, 10 systems, 9 cold bootable, 8 plus years">
